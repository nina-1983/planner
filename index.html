<!DOCTYPE html>
<html>
<head>
  <title>Notion API Test</title>
</head>

<body style="font-family: Arial; padding: 40px; background: #F5F0EB;">
  <h1>Notion API Test</h1>

  <button id="syncBtn" style="padding: 12px 18px;">
    Test API
  </button>

  <h2 id="status">Waiting...</h2>

  <pre id="output" style="background: white; padding: 15px; border-radius: 8px; white-space: pre-wrap;"></pre>

  <script>
    document.getElementById("syncBtn").addEventListener("click", async function () {
      const status = document.getElementById("status");
      const output = document.getElementById("output");

      status.innerText = "Clicked — checking API...";
      output.innerText = "";

      try {
        const response = await fetch("/api/sync", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          }
        });

        const text = await response.text();

        status.innerText = "API responded";
        output.innerText = text;
      } catch (error) {
        status.innerText = "Fetch failed";
        output.innerText = error.message;
      }
    });
  </script>
</body>
</html>
