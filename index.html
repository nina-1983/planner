<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Planner Dashboard</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F5F0EB;
      color: #2C2420;
    }

    :root {
      --cream: #F5F0EB;
      --warm-white: #FDFAF7;
      --sage: #8A9E8A;
      --dusty-rose: #C49A8A;
      --warm-brown: #2C2420;
      --muted: #7A6E68;
      --border: #E8E0D8;
      --shadow: 0 2px 16px rgba(44,36,32,0.07);
    }

    .planner {
      min-height: 100vh;
      padding: 24px 16px 48px;
      background: var(--cream);
      background-image:
        radial-gradient(circle at 15% 10%, rgba(138,158,138,0.12) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(196,154,138,0.10) 0%, transparent 50%);
    }

    .inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header, .card {
      background: var(--warm-white);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-date {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--dusty-rose);
      margin-bottom: 8px;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(28px, 4vw, 40px);
      color: var(--warm-brown);
    }

    .header-quote {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      font-style: italic;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .sync-button, .toggle-button {
      background: var(--sage);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toggle-button {
      background: var(--cream);
      color: var(--warm-brown);
      border: 1px solid var(--border);
    }

    .toggle-button.active {
      background: var(--sage);
      color: white;
    }

    .weekend-work-button {
      align-self: flex-start;
      background: var(--warm-white);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .toggle-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .sync-indicator {
      font-size: 11px;
      color: var(--sage);
    }

    .error-message {
      font-size: 12px;
      color: #9B4A3A;
      background: #F7E8E2;
      padding: 8px 10px;
      border-radius: 8px;
      max-width: 320px;
      line-height: 1.4;
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--dusty-rose);
      font-weight: 600;
      margin: 18px 0 12px;
    }

    .task-item, .home-item, .client-item {
      padding: 12px;
      background: var(--cream);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .client-item {
      border-left: 3px solid var(--dusty-rose);
    }

    .task-priority {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .home-item-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
      letter-spacing: 0.8px;
    }

    .home-item-value {
      font-size: 13px;
      font-weight: 500;
    }

    .basics-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .basic-tag {
      background: var(--sage);
      color: white;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 10px;
    }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      cursor: pointer;
    }

    .check-row input {
      margin-top: 2px;
      accent-color: var(--sage);
      cursor: pointer;
    }

    .checked-text {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .reset-card {
      padding: 20px 22px;
    }

    .reset-intro {
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .reset-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .reset-item {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 10px;
    }

    .reset-item label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
    }

    .reset-item input {
      margin: 0;
      accent-color: var(--sage);
    }

    textarea,
    .brain-textarea,
    .notes-textarea {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      max-width: 100%;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--warm-brown);
      outline: none;
      resize: vertical;
      box-shadow: none;
    }

    textarea::placeholder {
      font-family: 'DM Sans', sans-serif;
      color: var(--muted);
      opacity: 0.65;
    }

    textarea:focus {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(138, 158, 138, 0.12);
    }

    .brain-textarea { min-height: 160px; }
    .notes-textarea { min-height: 110px; }

    @media(max-width: 700px) {
      .home-grid {
        grid-template-columns: 1fr;
      }

      .header-right {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const quotes = [
  "One thing at a time. Everything else can wait.",
  "Small moves. Steady pace. Real results.",
  "You don't need more hours — you need clearer priorities.",
  "Build the day before it builds itself.",
  "Slow is smooth. Smooth is fast.",
];

const resetCore = [
  "Drink water before anything else",
  "Open the curtains",
  "Brain dump before scrolling",
  "Move your body",
  "Choose one main focus"
];

const resetRotating = [
  "Step outside for fresh air",
  "Stretch your shoulders",
  "Tidy one tiny space",
  "Take three slow breaths",
  "Put music on",
  "Check in with your energy",
  "Write one thing you're looking forward to"
];

function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function priorityRank(priority) {
  if (!priority) return 99;
  if (priority.includes("🔴")) return 1;
  if (priority.includes("🟡")) return 2;
  if (priority.includes("🟢")) return 3;
  return 99;
}

function PlannerDashboard() {
  const today = new Date();

  const todayKey = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Europe/London",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).format(today);

  const todayStr = today.toLocaleDateString("en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric",
  });

  const todayName = today.toLocaleDateString("en-GB", {
    weekday: "long",
  });

  const isWeekend = today.getDay() === 0 || today.getDay() === 6;

  const [brainDump, setBrainDump] = useState(() => load("planner_brainDump", ""));
  const [notes, setNotes] = useState(() => load("planner_notes", ""));
  const [checkedItems, setCheckedItems] = useState(() =>
    load(`planner_checkedItems_${todayKey}`, {})
  );

  const [todayOnly, setTodayOnly] = useState(false);
  const [showWorkWeekend, setShowWorkWeekend] = useState(false);
  const [loading, setLoading] = useState(false);
  const [synced, setSynced] = useState(false);
  const [error, setError] = useState("");

  const [notionData, setNotionData] = useState(() =>
    load("planner_notionData", {
      weekTasks: [],
      clientFocus: [],
      homeToday: {},
    })
  );

  useEffect(() => {
    localStorage.setItem("planner_brainDump", JSON.stringify(brainDump));
  }, [brainDump]);

  useEffect(() => {
    localStorage.setItem("planner_notes", JSON.stringify(notes));
  }, [notes]);

  useEffect(() => {
    localStorage.setItem(`planner_checkedItems_${todayKey}`, JSON.stringify(checkedItems));
  }, [checkedItems]);

  const toggleChecked = (key) => {
    setCheckedItems({
      ...checkedItems,
      [key]: !checkedItems[key],
    });
  };

  const handleSync = async () => {
    setLoading(true);
    setError("");

    try {
      const response = await fetch("/api/sync", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Sync failed");
      }

      setNotionData(data);
      localStorage.setItem("planner_notionData", JSON.stringify(data));

      setSynced(true);
      setTimeout(() => setSynced(false), 2000);
    } catch (err) {
      setError(err.message);
    }

    setLoading(false);
  };

  const { weekTasks = [], clientFocus = [], homeToday = {} } = notionData;

  const sortedTasks = [...weekTasks].sort((a, b) => {
    const priorityDiff = priorityRank(a.priority) - priorityRank(b.priority);
    if (priorityDiff !== 0) return priorityDiff;

    return new Date(a.dueDate || "9999-12-31") -
      new Date(b.dueDate || "9999-12-31");
  });

  const todaysTasks = sortedTasks.filter((task) => {
    if (!task.dueDate) return false;
    return new Date(task.dueDate).toDateString() === today.toDateString();
  });

  const visibleTasks = todayOnly ? todaysTasks : sortedTasks;

  const resetPrompts = [
    ...resetCore,
    ...resetRotating.slice(today.getDay() % resetRotating.length, (today.getDay() % resetRotating.length) + 2)
  ];

  return (
    <div className="planner">
      <div className="inner">

        <header className="header">
          <div>
            <p className="header-date">{todayStr}</p>
            <h1 className="header-title">My Planner Dashboard</h1>
            <p className="header-quote">
              {quotes[today.getDay() % quotes.length]}
            </p>
          </div>

          <div className="header-right">
            <button className="sync-button" onClick={handleSync}>
              {loading ? "Syncing..." : "Sync Notion"}
            </button>

            {synced && <span className="sync-indicator">✓ synced</span>}
            {error && <div className="error-message">{error}</div>}
          </div>
        </header>

        <div className="card reset-card">
          <h2 className="card-title">{todayName} Reset</h2>

          <p className="reset-intro">
            Start gently. You don’t need to do everything.
          </p>

          <div className="reset-list">
            {resetPrompts.map((prompt) => {
              const key = `reset-${todayKey}-${prompt}`;

              return (
                <div className="reset-item" key={key}>
                  <label>
                    <input
                      type="checkbox"
                      checked={!!checkedItems[key]}
                      onChange={() => toggleChecked(key)}
                    />
                    <span className={checkedItems[key] ? "checked-text" : ""}>
                      {prompt}
                    </span>
                  </label>
                </div>
              );
            })}
          </div>
        </div>

        <div className="card">
          <h2 className="card-title">Home</h2>

          <div className="home-grid">
            {homeToday.mealPlan && (
              <div className="home-item">
                <div className="home-item-label">Meal plan</div>
                <div className="home-item-value">{homeToday.mealPlan}</div>
              </div>
            )}

            {homeToday.movement && (
              <div className="home-item">
                <div className="home-item-label">Movement</div>
                <div className="home-item-value">{homeToday.movement}</div>
              </div>
            )}
          </div>
        </div>

        {isWeekend ? (
          <>
            <button
              className="weekend-work-button"
              onClick={() => setShowWorkWeekend(!showWorkWeekend)}
            >
              {showWorkWeekend ? "Hide work again" : "Peek at work"}
            </button>

            {showWorkWeekend && (
              <div className="card">
                <h2 className="card-title">Work</h2>
              </div>
            )}
          </>
        ) : (
          <div className="card">
            <h2 className="card-title">Work</h2>

            <div className="toggle-row">
              <button
                className={`toggle-button ${!todayOnly ? "active" : ""}`}
                onClick={() => setTodayOnly(false)}
              >
                This week
              </button>

              <button
                className={`toggle-button ${todayOnly ? "active" : ""}`}
                onClick={() => setTodayOnly(true)}
              >
                Today only
              </button>
            </div>

            {visibleTasks.map((task) => {
              const key = `task-${task.id}`;

              return (
                <div className="task-item" key={key}>
                  <label className="check-row">
                    <input
                      type="checkbox"
                      checked={!!checkedItems[key]}
                      onChange={() => toggleChecked(key)}
                    />

                    <div>
                      <div className={checkedItems[key] ? "checked-text" : ""}>
                        {task.name}
                      </div>

                      <div className="task-priority">
                        {task.priority} • {task.dueDate}
                      </div>
                    </div>
                  </label>
                </div>
              );
            })}
          </div>
        )}

        <div className="card">
          <h2 className="card-title">Brain dump</h2>

          <textarea
            className="brain-textarea"
            value={brainDump}
            onChange={(e) => setBrainDump(e.target.value)}
            placeholder="Get it out of your head..."
            rows="6"
          />
        </div>

        <div className="card">
          <h2 className="card-title">Notes & reminders</h2>

          <textarea
            className="notes-textarea"
            value={notes}
            onChange={(e) => setNotes(e.target.value)}
            placeholder="Anything you don't want to forget..."
            rows="4"
          />
        </div>

      </div>
    </div>
  );
}

ReactDOM.render(<PlannerDashboard />, document.getElementById("root"));
</script>
</body>
</html>
